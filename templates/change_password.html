{% extends "base.html" %}
{% block title %}
Change Password - College Timetable
{% endblock %}
{% block page_title %}
Change Password
{% endblock %}
{% block content %}
<div style="
    max-width:520px;
    margin:40px auto;
">
    <div class="content-card">
        <div style="
            text-align:center;
            margin-bottom:25px;
        ">
            <div style="
                font-size:42px;
                margin-bottom:10px;
            ">
                🔐
            </div>
            <h2>
                Change Password
            </h2>
            <p style="
                color:#667085;
                margin-top:8px;
                font-size:14px;
            ">
                Update your password to keep your account secure.
            </p>
        </div>
        {% if error %}
        <div style="
            background:#fef3f2;
            color:#b42318;
            border:1px solid #fecdca;
            padding:12px 14px;
            border-radius:8px;
            margin-bottom:18px;
            font-size:14px;
        ">
            {{ error }}
        </div>
        {% endif %}
        <form
            method="POST"
        >
            <div
                class="form-group"
                style="margin-bottom:18px;"
            >
                <label>
                    Current Password
                </label>
                <input
                    type="password"
                    name="current_password"
                    placeholder="Enter current password"
                    required
                >
            </div>
            <div
                class="form-group"
                style="margin-bottom:18px;"
            >
                <label>
                    New Password
                </label>
                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >
            </div>
            <div
                class="form-group"
                style="margin-bottom:22px;"
            >
                <label>
                    Confirm New Password
                </label>
                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >
            </div>
            <button
                type="submit"
                class="btn-primary"
                style="
                    width:100%;
                    height:45px;
                "
            >
                🔐 Change Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
